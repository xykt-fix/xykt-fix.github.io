<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Clone</title>
    <!-- Importing Duolingo-style font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* CSS RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #3c3c3c;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER & PROGRESS BAR */
        header {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            font-size: 24px;
            color: #afafaf;
            cursor: pointer;
            font-weight: bold;
        }

        .progress-container {
            flex-grow: 1;
            background-color: #e5e5e5;
            height: 16px;
            border-radius: 16px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 20%; /* Controlled via JS */
            border-radius: 16px;
            transition: width 0.3s ease;
        }

        /* MAIN CONTENT AREA */
        main {
            flex-grow: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 32px;
        }

        /* MASCOT & SPEECH BUBBLE */
        .prompt-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .mascot {
            font-size: 60px; /* Temporary placeholder for Duo owl */
        }

        .speech-bubble {
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            position: relative;
            font-size: 19px;
            font-weight: 700;
        }

        /* Speech bubble left arrow point */
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 12px 6px 0;
            border-style: solid;
            border-color: transparent #e5e5e5 transparent transparent;
        }

        /* INTERACTIVE OPTIONS CONTAINER */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: auto;
        }

        /* DUOLINGO 3D "PRESSY" BUTTONS */
        .option-card {
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 4px 0 #e5e5e5;
            transition: all 0.1s ease;
        }

        .option-card:hover {
            background-color: #f7f7f7;
        }

        .option-card.selected {
            background-color: #ddf4ff;
            border-color: #84d8ff;
            box-shadow: 0 4px 0 #84d8ff;
            color: #1899d6;
        }

        /* Press active state simulation */
        .option-card:active, .option-card.selected:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        /* FOOTER ACTIONS */
        footer {
            border-top: 2px solid #e5e5e5;
            padding: 24px 16px;
            background-color: #ffffff;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .check-btn {
            background-color: #58cc02;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 16px 40px;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #46a302;
            width: 100%;
            text-align: center;
        }

        .check-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        .check-btn:disabled {
            background-color: #e5e5e5;
            color: #afafaf;
            box-shadow: 0 4px 0 #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        /* RESPONSIVE LAYOUT FOR TABLETS/DESKTOPS */
        @media (min-width: 480px) {
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .check-btn {
                width: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation and Progress Tracker -->
    <header>
        <div class="close-btn">✕</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </header>

    <!-- Main Exercise Area -->
    <main>
        <h2>Select the correct translation</h2>
        
        <div class="prompt-container">
            <div class="mascot">🦉</div>
            <div class="speech-bubble">
                The boy eats an apple.
            </div>
        </div>

        <!-- Multiple Choice Selection Grid -->
        <div class="options-grid">
            <button class="option-card" onclick="selectOption(this, false)">El niño come un plátano.</button>
            <button class="option-card" onclick="selectOption(this, true)">El niño come una manzana.</button>
            <button class="option-card" onclick="selectOption(this, false)">La niña come una manzana.</button>
            <button class="option-card" onclick="selectOption(this, false)">El hombre bebe agua.</button>
        </div>
    </main>

    <!-- Bottom Verification Bar -->
    <footer>
        <div class="footer-content">
            <button class="check-btn" id="submitBtn" disabled onclick="checkAnswer()">CHECK</button>
        </div>
    </footer>

    <!-- Frontend Core Application Logic -->
    <script>
        let selectedElement = null;
        let isCorrectAnswer = false;

        // Handles choice highlighted behavior
        function selectOption(element, isCorrect) {
            // Reset previous choices
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });

            // Highlight current choices
            element.classList.add('selected');
            selectedElement = element;
            isCorrectAnswer = isCorrect;

            // Enable check selection button
            document.getElementById('submitBtn').removeAttribute('disabled');
        }

        // Verifies the user submission accuracy
        function checkAnswer() {
            if (!selectedElement) return;

            if (isCorrectAnswer) {
                alert("🎉 Excellent! That is correct.");
                // Advance the progress bar visual filling state
                document.getElementById('progressBar').style.width = "100%";
            } else {
                alert("❌ Incorrect. Try the other option!");
            }
        }
    </script>
</body>
</html>
