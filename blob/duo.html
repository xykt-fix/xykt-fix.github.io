<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Core Learning Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* CORE CONFIGURATION & DIN TYPOGRAPHY STYLING */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "DIN Next Rounded Bold", "Nunito", -apple-system, sans-serif;
            font-weight: 800;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            color: #3c3c3c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* STICKY MAIN HEADER BANNER */
        header {
            background-color: #00a2f3;
            color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 0 #008cd4;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            font-size: 22px;
            cursor: pointer;
            display: none;
            width: 24px;
        }

        .header-text {
            flex-grow: 1;
        }

        .banner-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.9;
        }

        .banner-subtitle {
            font-size: 18px;
            font-weight: 900;
        }

        .progress-container {
            width: 130px;
            background-color: #008cd4;
            height: 14px;
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* VIEW 1: HOME LEARNING PATH LAYOUT */
        #pathView {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
        }

        /* SECTORS UNIT BLOCK CARD */
        .unit-card-block {
            width: 100%;
            padding: 20px 16px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
        }

        /* Alternate distinctive coloring for the 10 Units */
        .u1 { background-color: #58cc02; }
        .u2 { background-color: #00a2f3; }
        .u3 { background-color: #ff9633; }
        .u4 { background-color: #ff4b4b; }
        .u5 { background-color: #a076ec; }
        .u6 { background-color: #ff84ff; }
        .u7 { background-color: #26dad2; }
        .u8 { background-color: #ffc83b; }
        .u9 { background-color: #718093; }
        .u10 { background-color: #110055; }

        .unit-number {
            font-size: 13px;
            text-transform: uppercase;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        .unit-desc {
            font-size: 19px;
            font-weight: 900;
        }

        /* SNAKE LEVEL CONTAINER TRACK */
        .nodes-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 28px;
            background-color: #f7f7f7;
            border-bottom: 2px solid #e5e5e5;
        }

        .node-row {
            display: flex;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        /* Snake Alternating Offset Layout Grid Alignment */
        .pos-left { transform: translateX(-55px); }
        .pos-mid-left { transform: translateX(-28px); }
        .pos-mid { transform: translateX(0); }
        .pos-mid-right { transform: translateX(28px); }
        .pos-right { transform: translateX(55px); }

        .start-tooltip {
            position: absolute;
            top: -42px;
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            color: #1cb0f6;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 4px 0 #e5e5e5;
            animation: bounce 2s infinite;
            z-index: 10;
        }

        .start-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
        }

        /* Path Level Buttons Base Setup */
        .node-btn {
            width: 70px;
            height: 66px;
            border-radius: 50%;
            border: none;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background-color: #e5e5e5;
            box-shadow: 0 6px 0 #cccccc;
            color: #afafaf;
            transition: transform 0.1s combined, box-shadow 0.1s;
        }

        .node-btn.unlocked {
            background-color: #1cb0f6;
            box-shadow: 0 6px 0 #1899d6;
            color: #ffffff;
            cursor: pointer;
        }

        .node-btn.current {
            background-color: #58cc02;
            box-shadow: 0 6px 0 #46a302;
            color: #ffffff;
            cursor: pointer;
            outline: 6px solid #e5e5e5;
            outline-offset: 4px;
        }

        .node-btn:active:not(.locked) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 transparent;
        }

        /* VIEW 2: INTERACTIVE LESSON MODE */
        #lessonView {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 32px 16px;
            flex-direction: column;
            flex-grow: 1;
        }

        .question-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 28px;
        }

        /* CHARACTER PLACEMENT ROW */
        .character-box {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }

        /* Dynamic Sprite sheet configurations mapping Duolingo artwork directly */
        .sprite-avatar {
            width: 90px;
            height: 95px;
            background-image: url('https://squarespace-cdn.com');
            background-size: auto 95px;
            background-repeat: no-repeat;
            flex-shrink: 0;
        }

        .speech-bubble {
            border: 2px solid #e5e5e5;
            border-radius: 18px;
            padding: 16px;
            position: relative;
            font-size: 17px;
            font-weight: 800;
            flex-grow: 1;
            background-color: #ffffff;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 12px 6px 0;
            border-style: solid;
            border-color: transparent #e5e5e5 transparent transparent;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 40px;
        }

        .option-card {
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 4px 0 #e5e5e5;
            transition: all 0.05s ease;
        }

        .option-card:hover:not(.checked) {
            background-color: #f7f7f7;
        }

        .option-card.selected {
            background-color: #ddf4ff;
            border-color: #84d8ff;
            box-shadow: 0 4px 0 #84d8ff;
            color: #1899d6;
        }

        .option-card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 transparent;
        }

        /* PRIMARY LOWER ACTION BUTTON BLOCK */
        footer {
            border-top: 2px solid #e5e5e5;
            padding: 20px 16px;
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            margin-top: auto;
        }

        .check-btn {
            background-color: #58cc02;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #46a302;
            width: 100%;
            text-align: center;
        }

        .check-btn:disabled {
            background-color: #e5e5e5;
            color: #afafaf;
            box-shadow: 0 4px 0 #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        /* BOUNCING KEYFRAME MECHANIC */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (min-width: 480px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- App Global Sticky Header Frame -->
    <header>
