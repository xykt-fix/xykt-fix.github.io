<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Learning Path</title>
    <!-- Importing DIN Rounded alternative from Google Fonts (Nunito is the universal web alternative) -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* CORE CONFIGURATION */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Applying DIN Rounded typography attributes system-wide */
            font-family: "DIN Next Rounded Bold", "Nunito", -apple-system, sans-serif;
            font-weight: 800;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* TOP SECTION BANNER */
        .section-banner {
            background-color: #00a2f3;
            color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 18px 24px;
            border-radius: 0 0 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 #008cd4;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .banner-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .banner-subtitle {
            font-size: 22px;
            font-weight: 900;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        /* SNAKE LEVEL PATH CONTAINER */
        .path-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            gap: 24px;
            position: relative;
        }

        /* ALTERNATING POSITION LAYOUTS (The Snake Alignment) */
        .node-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .pos-left { justify-content: center; transform: translateX(-40px); }
        .pos-mid { justify-content: center; }
        .pos-right { justify-content: center; transform: translateX(40px); }

        /* ACTIVE REPETITIVE START TOOLTIP */
        .start-tooltip {
            position: absolute;
            top: -45px;
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            color: #1899d6;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 0 #e5e5e5;
            animation: bounce 2s infinite;
        }

        .start-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* GENERIC INTERACTIVE BUTTON PROPERTIES */
        .node-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.1s ease;
        }

        .node-btn:active {
            transform: scale(0.95);
        }

        /* ACTIVE LEVEL NODE LOOKS */
        .node-active {
            background-color: #1cb0f6;
            box-shadow: 0 8px 0 #1899d6;
            color: #ffffff;
            outline: 6px solid #e5e5e5;
            outline-offset: 4px;
        }

        /* UNLOCKED COMPLETION LOOKS */
        .node-completed {
            background: linear-gradient(135deg, #2be005, #1cb0f6);
            box-shadow: 0 8px 0 #24bc04;
            color: #ffffff;
        }

        /* LOCKED GREYED OUT LEVEL LOOKS */
        .node-locked {
            background-color: #e5e5e5;
            box-shadow: 0 8px 0 #cccccc;
            color: #afafaf;
            cursor: not-allowed;
        }

        /* ASSET COMPONENT VARIANTS */
        .node-chest {
            width: 75px;
            height: 60px;
            border-radius: 16px;
        }

        /* STARS INJECTION LAYOUT */
        .stars-row {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            font-size: 14px;
            color: #ccc;
        }
        .star-filled { color: #ffd700; }

        /* BOUNCING ANIMS FOR TOOLTIP */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- Section & Unit Metadata Info Frame -->
    <div class="section-banner">
        <div>
            <div class="banner-title">Section 3, Unit 1</div>
            <div class="banner-subtitle">Describe activities</div>
        </div>
        <div class="menu-icon">📋</div>
    </div>

    <!-- Central Game Path Flow -->
    <div class="path-container">

        <!-- Stage 1: Speech Bubble Node -->
        <div class="node-wrapper pos-mid">
            <button class="node-btn node-completed">💬</button>
        </div>

        <!-- Stage 2: Main Active Selection Level -->
        <div class="node-wrapper pos-left" style="margin-top: 25px;">
            <div class="start-tooltip">START</div>
            <button class="node-btn node-active">⭐</button>
        </div>

        <!-- Stage 3: Gray Book Node -->
        <div class="node-wrapper pos-left">
            <button class="node-btn node-locked">📖</button>
        </div>

        <!-- Stage 4: Gray Locked Treasure Chest Box -->
        <div class="node-wrapper pos-mid">
            <button class="node-btn node-locked node-chest">🔒</button>
        </div>

        <!-- Stage 5: Right Aligned Star Node -->
        <div class="node-wrapper pos-right">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <button class="node-btn node-locked">⭐</button>
                <div class="stars-row">
                    <span>★</span><span>★</span><span>★</span>
                </div>
            </div>
        </div>

        <!-- Stage 6: Left Shifted Barbell/Dumbbell Gym Exercise -->
        <div class="node-wrapper pos-mid">
            <button class="node-btn node-locked">🏋️</button>
        </div>

    </div>

</body>
</html>
